services:
  - type: web
    name: Smart-Order
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgres.prisma && npx prisma db push --schema=prisma/schema.postgres.prisma && NEXT_OUTPUT=standalone npm run build:selfhost
    startCommand: npm run start:selfhost
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false  # set in dashboard (PostgreSQL connection string)
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
