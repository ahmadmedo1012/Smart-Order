name: CI

# r127 (F7): Smart-Order كان المستودع الوحيد في العائلة بلا CI —
# 197 parity pin + lint + build تصبح ذاتية التحقق مع كل دفعة/PR إلى main.
# البنية مرآة smart-link/.github/workflows/ci.yml مع فرقين مقصودين:
#   1) لا Playwright — الـ e2e (tests/e2e/api-e2e.js) يحتاج خادماً حياً
#      بقاعدة بيانات حقيقية؛ جودة التوكنات محمية هنا بواسطة test:parity.
#   2) التثبيت عبر bun وليس `npm ci` — قفل المستودع هو bun.lock
#      (package-lock.json مُجهَّل عمداً في .gitignore)، ولإثبات ذلك
#      تجربة حية: `npm install` يجرّ eslint-config-next@16.4.0
#      (eslint-plugin-react-hooks 7.1.1) فيولّد 26 خطأً من قواعد
#      React-Compiler الجديدة، بينما القفل يثبّت 16.1.3/7.0.1 ونظيف.
#      وإضافة package-lock.json كانت ستقلب كشف مدير الحزم على Vercel
#      (ترتيب الكواشف في vercel CLI: npm ← pnpm ← bun ← yarn) وتحوّل
#      تثبيت الإنتاج من bun إلى npm — سلسلة النشر التي شُفيت في
#      fdd57ff لا تُقامر بها. bun --frozen-lockfile = نفس ما يثبّته
#      الإنتاج، بالضبط.
# r132 (W3-1): أضيفت وظيفة test — الـ e2e (tests/e2e/api-e2e.js) يقلع
#      الآن في CI على قاعدة SQLite تجريبية بنفس حيلة الإقلاع من W3-B2
#      (r130): prisma db push على المخطط التطويري ثم next start —
#      السجل ذاتي التزويد (تسجيل أعمال + كتالوج + طلب) فلا حاجة لـ seed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least privilege — الوظيفة قراءة وتشغيل اختبارات فقط
permissions:
  contents: read

# push متتابع يلغي التشغيل القديم المتقادم
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + parity + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22 (وقت تشغيل أدوات البناء)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # r133: packageManager=bun@1.3.14 — setup-node's auto-cache would demand
          # package-lock.json (fatal: repo is bun.lock by contract). The bun cache
          # itself is handled by oven-sh/setup-bun below (bun.lock fingerprint).
          package-manager-cache: false

      # bun 1.3.14 = الإصدار الذي اجتازت البوابات الثلاث عليه محلياً
      # (r127-F7)؛ أي رفع لهذا الرقم يستوجب إعادة تشغيل البوابات.
      # setup-bun يخزّن كاش bun مؤمّناً على بصمة bun.lock تلقائياً.
      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # --frozen-lockfile: تثبيت حرفي من bun.lock (نفس ما يثبّته Vercel)
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Lint (ESLint صفر أخطاء)
        run: npm run lint

      # r134 (W2 #7): حارس التوأمين — prisma/schema.prisma (SQLite تطوير)
      # و schema.postgres.prisma (PostgreSQL إنتاج) يُبقيان يدوياً؛ أي
      # انحراف في النماذج يفشل الدفعة قبل البناء. كتلا generator/datasource
      # مستثناة بالتصميم (فروق النشر المقصودة). قرار r134: لا تبنّي
      # prisma migrate هذه الجولة — موثّق في رأس السكربت.
      - name: Schema twins (SQLite ⇄ PostgreSQL)
        run: node scripts/check-schema-twins.mjs

      # r126/r127: Madarek parity — 197 pins: القيم القانونية (ألوان/
      # أنصاف أقواس/حركة/z/ارتفاعات) + بوابات الاستهلاك + أسلاك العائلات
      # + حبر واتساب؛ أي انحراف يفشل الدفعة قبل البناء أصلاً.
      - name: Madarek parity snapshot
        run: npm run test:parity

      # توليد عميل Prisma (مخطط SQLite التطويري — التوليد لا يحتاج
      # قاعدة بيانات؛ يطابق سلسلة vercel.json: generate قبل build)
      - name: Prisma generate
        run: npx prisma generate

      # البناء لا يحتاج قاعدة بيانات إطلاقاً — كل مسارات DB هي
      # force-dynamic ومحمية بـ try/catch (DEPLOYMENT.md §2)
      - name: Build (يضم tsc صارماً)
        run: npm run build

  # r132 (W3-1): كانت العائلة تتحقق بصريًا فقط — الآن وظيفة اختبار حقيقية:
  # الصحة، المصادقة، عزل المستأجرين (حرج)، حدود المعدل، دورة الطلب،
  # الـ idempotency، والتحقق وإعادة تسعير الأموال — على خادم إنتاج حقيقي.
  test:
    name: E2E API (SQLite تجريبية)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      # مطابق للافتراضي التطويري في .env.example — ملف SQLite محلي،
      # بلا خادم قاعدة بيانات خارجي (حيلة W3-B2 في r130 للإقلاع).
      DATABASE_URL: "file:./db/smart-order.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # r133: same as above — bun.lock repo, setup-bun owns the cache.
          package-manager-cache: false

      - name: Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # المخطط التطويري (SQLite) — التوليد لا يحتاج قاعدة، والدفع
      # ينشئ ملف القاعدة محليًا. لا seed: السجل ذاتي التزويد.
      - name: Prisma generate + db push (SQLite)
        run: |
          npx prisma generate
          npx prisma db push

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start > server.log 2>&1 &
          echo $! > server.pid

      - name: انتظار صحة الخادم
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "الخادم صحي بعد ${i} محاولة"; exit 0
            fi
            sleep 2
          done
          echo "الخادم لم يصبح صحيًا"; cat server.log; exit 1

      - name: E2E API suite
        run: npm run test:e2e

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

      - name: Upload server log (عند الفشل فقط)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-log
          path: server.log
          retention-days: 7
